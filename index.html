<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ภาระงานบุคลากร สกร.เมืองหนองบัวลำภู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy system bar (name + fiscal year) → work-group chips → tabs; main view is a staff × task score grid with sticky names on the left and a cell popover */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e9edf4; --line:#d5dbe6; --ink:#14213d; --muted:#56627a;
  --brand:#1b3a6b; --brand-ink:#ffffff; --brand-muted:#b9c7e0;
  --accent:#2b59c3; --accent-ink:#ffffff; --accent-soft:#e3eafb; --code:#0d6f78;
  --s-on:#157f3b; --s-on-bg:#dcf2e3; --s-partial:#9a5800; --s-partial-bg:#fbecd0;
  --s-late:#4b5563; --s-late-bg:#e5e7eb; --s-none:#b42318; --s-none-bg:#fde2df; --s-wait:#6b7690;
  --shadow:0 12px 36px rgba(20,33,61,.22);
  --f-display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --surface:#161e2e; --sunk:#1d2738; --line:#2c3850; --ink:#e6ebf5; --muted:#9aa6bd;
  --brand:#13213b; --brand-ink:#eef2fa; --brand-muted:#8fa1c4;
  --accent:#7aa2ff; --accent-ink:#0b1426; --accent-soft:#1f2d4d; --code:#4fc3cc;
  --s-on:#6fd396; --s-on-bg:#173527; --s-partial:#f2bd5c; --s-partial-bg:#3b2d14; --s-late:#b8c0cc; --s-late-bg:#2a3240;
  --s-none:#ff8b80; --s-none-bg:#43201d; --s-wait:#8793ab; --shadow:0 12px 36px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --surface:#161e2e; --sunk:#1d2738; --line:#2c3850; --ink:#e6ebf5; --muted:#9aa6bd;
  --brand:#13213b; --brand-ink:#eef2fa; --brand-muted:#8fa1c4;
  --accent:#7aa2ff; --accent-ink:#0b1426; --accent-soft:#1f2d4d; --code:#4fc3cc;
  --s-on:#6fd396; --s-on-bg:#173527; --s-partial:#f2bd5c; --s-partial-bg:#3b2d14; --s-late:#b8c0cc; --s-late-bg:#2a3240;
  --s-none:#ff8b80; --s-none-bg:#43201d; --s-wait:#8793ab; --shadow:0 12px 36px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.inner{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(19px,2.6vw,24px)}
h2{font-size:18px}
h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* system bar */
.sysbar{background:var(--brand);color:var(--brand-ink)}
.sysbar .inner{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding-block:16px}
.org{font-size:13px;color:var(--brand-muted);letter-spacing:.02em}
.fybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fybox label{font-size:13px;color:var(--brand-muted)}
.fysel{font-family:var(--f-display);font-weight:600;font-size:16px;padding:4px 10px;background:rgba(255,255,255,.1);color:var(--brand-ink);border:1px solid rgba(255,255,255,.25);border-radius:6px}
.fysel option{color:#14213d;background:#fff}
.btn-on-brand{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--brand-ink);border-radius:6px;padding:4px 12px;font-size:13px}
/* group bar */
.groupbar{background:var(--surface);border-bottom:1px solid var(--line)}
.groupbar .inner{padding-block:12px}
.gb-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.gchip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gchip[aria-pressed=true] .n{color:var(--accent-ink);opacity:.8}
.gchip.add{border-style:dashed;color:var(--accent)}
.gadd{display:inline-flex;gap:6px;align-items:center}
/* tabs */
.tabs{display:flex;gap:2px;margin:16px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;font-family:var(--f-display)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-bottom:60px}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--s-none)}
.btn.danger.armed{background:var(--s-none);color:#fff;border-color:var(--s-none)}
.notice{background:var(--sunk);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px;min-width:0}
.mini{font-size:13px;color:var(--muted)}
/* score grid */
.mx{overflow:auto;max-height:calc(100vh - 140px);border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mx table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.mx th,.mx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.mx thead th{position:sticky;background:var(--sunk);z-index:2;font-weight:600;font-size:12px;color:var(--muted);text-align:left;vertical-align:bottom}
.mx thead tr:first-child th{top:0;height:30px;padding:4px 8px}
.mx thead tr:nth-child(2) th{top:30px;padding:6px 8px;width:118px;min-width:118px;max-width:118px}
.mx th.ihead{color:var(--code);font-family:var(--f-display);font-size:13px;border-bottom:2px solid var(--code)}
.mx .ihwrap{width:0;min-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mx .tname{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);font-size:12.5px;line-height:1.35;font-weight:600}
.mx .tdue{font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.mx th.tcol{cursor:pointer}
.mx th.tcol:hover .tname{color:var(--accent)}
.mx .sticky{position:sticky;left:0;z-index:1;background:var(--surface)}
.mx thead .sticky{z-index:3;background:var(--sunk);width:230px;min-width:230px}
.mx td.who{padding:6px 10px;width:230px;min-width:230px;max-width:230px;cursor:pointer}
.mx td.who:hover .nm{color:var(--accent)}
.mx td.who .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx td.who .pos{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx td.cell{text-align:center;height:46px;cursor:pointer;min-width:118px}
.mx td.cell:hover{background:var(--accent-soft)}
.mx td.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mx td.cell .plus{opacity:0;color:var(--accent);font-size:18px}
.mx td.cell:hover .plus{opacity:.7}
.mx td.tot{padding:4px 10px;text-align:right;font-weight:700;min-width:64px;background:var(--sunk)}
.mx thead th.tot{text-align:right}
.mx tbody tr:hover td.who{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:2px 8px;border-radius:5px;font-weight:700;font-size:14px}
.p-on{background:var(--s-on-bg);color:var(--s-on)}
.p-partial{background:var(--s-partial-bg);color:var(--s-partial)}
.p-late{background:var(--s-late-bg);color:var(--s-late)}
.p-none{background:var(--s-none-bg);color:var(--s-none)}
.p-wait{border:1.5px dashed var(--s-wait);color:var(--s-wait);font-weight:600;font-size:12px}
.neg{color:var(--s-none)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center;margin-top:10px}
.legend .pill{min-width:36px;font-size:12px}
/* popover */
.plist{display:grid;gap:8px;margin-top:8px}
.prow{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prow.mine{border-color:var(--accent);background:var(--bg)}
.pact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pop{max-height:min(640px,88vh);overflow:auto}
.pop{position:fixed;z-index:30;width:380px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px}
.pop .ptitle{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.35}
.pop .pmeta{font-size:13px;color:var(--muted);margin:4px 0 10px}
.pop .pwho{font-size:13px;margin-bottom:6px}
.pop .pwho b{font-weight:600}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;text-align:left;font-size:13px;display:flex;gap:8px;align-items:center}
.choice .sc{font-weight:700;min-width:30px;text-align:center;border-radius:4px;padding:0 4px}
.choice[aria-pressed=true]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.choice.on{color:var(--s-on)} .choice.partial{color:var(--s-partial)} .choice.late{color:var(--s-late)} .choice.none{color:var(--s-none)}
.choice .lb{color:var(--ink)}
.pfields{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:13px;margin-bottom:10px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.hint{font-size:12px;color:var(--s-none)}
@media (max-width:600px){.pop{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mx td.who,.mx thead .sticky{width:150px;min-width:150px;max-width:150px}}
/* report + tables */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.tile{background:var(--surface);padding:12px 16px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.std{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.std th,table.std td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.std th{font-size:13px;font-weight:600;color:var(--muted);background:var(--sunk);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.num{text-align:right!important}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
table.std tbody tr:last-child td{border-bottom:0}
.nm{font-weight:600}
.pos{font-size:13px;color:var(--muted)}
.load{display:flex;align-items:center;gap:8px;min-width:130px}
.load .track{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.load .fill{height:100%;background:var(--accent)}
.load b{min-width:22px;text-align:right}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.c-high{background:var(--s-partial-bg);color:var(--s-partial)}
.c-low{background:var(--sunk);color:var(--muted)}
.c-zero{background:var(--s-none-bg);color:var(--s-none)}
.c-ok{background:var(--s-on-bg);color:var(--s-on)}
.score{font-weight:700}
.st{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;white-space:nowrap}
.st-on{background:var(--s-on-bg);color:var(--s-on)} .st-partial{background:var(--s-partial-bg);color:var(--s-partial)}
.st-late{background:var(--s-late-bg);color:var(--s-late)} .st-none{background:var(--s-none-bg);color:var(--s-none)}
.st-wait{border:1px dashed var(--line);color:var(--s-wait)}
/* indicators */
.ghead{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.ghead::after{content:"";flex:1;height:1px;background:var(--line)}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.ind-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ind-h .code{font-family:var(--f-display);font-weight:600;color:var(--code)}
.ind-h h3{flex:1 1 220px;min-width:0}
.ind-h .meta{font-size:13px;color:var(--muted)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.task:hover{background:var(--accent-soft)}
.task .tn{font-weight:600}
.task .tm{font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:flex-end;max-width:240px}
.dot{width:10px;height:10px;border-radius:2px;background:var(--sunk);border:1px solid var(--line);display:inline-block}
.dot.on{background:var(--s-on);border-color:var(--s-on)} .dot.partial{background:var(--s-partial);border-color:var(--s-partial)}
.dot.late{background:var(--s-late);border-color:var(--s-late)} .dot.none{background:var(--s-none);border-color:var(--s-none)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h3{margin-bottom:10px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text]{flex:1 1 160px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
.scorerow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center;margin-bottom:8px}
/* slide-over */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-h{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) 14px 20px;display:flex;gap:10px;align-items:center;z-index:2}
.panel-h h2{flex:1;min-width:0}
.panel-b{padding:18px max(20px,env(safe-area-inset-right,0px)) 40px 20px}
.picker{border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:300px;overflow-y:auto}
.pgrp{padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);background:var(--sunk);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.pitem{display:flex;gap:8px;align-items:center;padding:5px 12px;cursor:pointer}
.pitem:hover{background:var(--accent-soft)}
.res{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rrow{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rrow:last-child{border-bottom:0}
.rtop{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 9px;font-size:13px}
.seg button[aria-pressed=true].on{background:var(--s-on-bg);color:var(--s-on);border-color:var(--s-on)}
.seg button[aria-pressed=true].partial{background:var(--s-partial-bg);color:var(--s-partial);border-color:var(--s-partial)}
.seg button[aria-pressed=true].late{background:var(--s-late-bg);color:var(--s-late);border-color:var(--s-late)}
.seg button[aria-pressed=true].none{background:var(--s-none-bg);color:var(--s-none);border-color:var(--s-none)}
.rmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.rmeta input[type=text]{flex:1 1 140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:40;font-size:14px}
.ro .edit-only{display:none!important}
/* task tracking */
.task2{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.task2:last-child{border-bottom:0}
.t-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.t-main{cursor:pointer;flex:1 1 260px;min-width:0}
.t-main .tn{font-weight:600}
.t-main .tm{font-size:13px;color:var(--muted)}
.t-main:hover .tn{color:var(--accent)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--s-on)}
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:2px 3px 2px 10px;font-size:13px;border:1px solid transparent;max-width:100%}
.pchip b{border-radius:999px;padding:0 7px;font-size:12px;background:var(--surface);min-width:28px;text-align:center}
.k-on{background:var(--s-on-bg);color:var(--s-on)} .k-partial{background:var(--s-partial-bg);color:var(--s-partial)}
.k-late{background:var(--s-late-bg);color:var(--s-late)} .k-none{background:var(--s-none-bg);color:var(--s-none)}
.k-wait{background:var(--surface);border:1px dashed var(--s-wait);color:var(--ink)} .k-wait b{background:var(--sunk);color:var(--s-wait)}
.apop{max-height:min(560px,85vh);overflow:auto}
.apop .picker{max-height:min(320px,48vh)}
/* documents + tooltip */
.origin{padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--bg)}
.origin b{color:var(--ink);font-weight:600}
.doccard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;margin-bottom:10px;display:grid;gap:6px}
.doccard .dsrc{font-size:12px;font-weight:600;color:var(--code)}
.doccard .dsub{font-weight:600}
.doccard .dmeta{font-size:13px;color:var(--muted)}
.flinks{display:flex;flex-wrap:wrap;gap:6px}
.flink{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 10px;font-size:13px;text-decoration:none;max-width:100%}
.flink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;max-width:320px;box-shadow:var(--shadow)}
.tip b{font-weight:700}
.tip .tg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;margin:6px 0;font-variant-numeric:tabular-nums}
.tip .tg span:nth-child(2n){text-align:right;font-weight:600}
.tip .tl{opacity:.75;font-size:12px}
.gmx td.gc{text-align:center;font-variant-numeric:tabular-nums}
.gmx td.gc b{font-size:15px}
.gmx td.gc small{display:block;font-size:11px;color:var(--muted)}
/* roles */
.role{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-right:6px}
.role .badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;font-weight:600}
.role .badge.admin{background:#f2c14e;color:#1b2440;border-color:#f2c14e}
.role button{background:none;border:0;color:var(--brand-muted);text-decoration:underline;font-size:12px;padding:0}
.tab.adm::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0a92e;margin-right:6px;vertical-align:middle}
.tabsep{flex:0 0 1px;background:var(--line);margin:8px 6px}
/* import */
.steps{display:grid;gap:18px}
.step h3{display:flex;gap:10px;align-items:center}
.step h3 .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fchip{display:inline-flex;gap:6px;align-items:center;background:var(--sunk);border-radius:6px;padding:3px 8px;font-size:13px;max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{border:0;background:none;color:var(--s-none);padding:0 2px}
.status{font-size:14px;margin-top:10px;padding:8px 12px;border-radius:6px;background:var(--sunk)}
.status.err{background:var(--s-none-bg);color:var(--s-none)}
.status.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.irow{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:10px}
.irow.off{opacity:.5}
.ihead2{display:grid;grid-template-columns:auto minmax(0,200px) 80px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 12px}
.qgrid .qwide{grid-column:1/-1}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) 150px minmax(0,190px) auto;gap:8px;align-items:center;padding:6px 12px}
.trow [data-assign]{overflow:hidden;text-overflow:ellipsis;text-align:left}
.trow .bul{color:var(--muted);text-align:center}
@media (max-width:640px){.ihead2{grid-template-columns:auto 1fr auto}.ihead2 .ig{grid-column:2/4}.ihead2 .ic{grid-column:2/3}.ihead2 .in{grid-column:1/4}
  .trow{grid-template-columns:1fr auto}.trow .bul{display:none}.trow input[type=date],.trow [data-assign]{grid-column:1/2}}
@media (max-width:560px){.task{grid-template-columns:1fr}.dots{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>

<script src="config.js"></script>
<script src="js/api.js"></script>
</head>
<body>
<div id="app">
  <header class="sysbar"><div class="inner">
    <div>
      <div class="org">ศูนย์ส่งเสริมการเรียนรู้ระดับอำเภอเมืองหนองบัวลำภู (สกร.)</div>
      <h1>ระบบติดตามภาระงานและการส่งงานบุคลากร</h1>
    </div>
    <div class="fybox">
      <span id="role" class="role"></span>
      <label for="fy">ปีงบประมาณ</label>
      <select id="fy" class="fysel"></select>
      <button class="btn-on-brand edit-only" id="addFy" type="button">+ เพิ่มปี</button>
    </div>
  </div></header>
  <section class="groupbar" aria-label="กลุ่มงาน"><div class="inner">
    <div class="gb-label">กลุ่มงาน</div>
    <div class="chips" id="groups"></div>
  </div></section>
  <div class="inner">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <main id="view"><div class="notice">กำลังเชื่อมต่อฐานข้อมูล… ตารางบุคลากรและงานของปีงบประมาณจะแสดงที่นี่</div></main>
  </div>
</div>
<div id="layer"></div>
<div id="poplayer"></div>
<div id="asslayer"></div>
<div id="tip" class="tip" hidden></div>

<script>
(function(){
const STATUS = [
  {k:"on", label:"ส่งครบ ตรงเวลา"},
  {k:"partial", label:"ส่งไม่ครบ / ไม่ตามกำหนด"},
  {k:"late", label:"ส่งล่าช้า"},
  {k:"none", label:"ละเลย / ไม่ส่ง"}
];
const GROUPS_FIXED = ["การเงิน","พัสดุ","การจัดการเรียนรู้เพื่อคุณวุฒิตามระบบ","การจัดการเรียนรู้เพื่อพัฒนาตนเอง","การจัดการเรียนรู้ตลอดชีวิต","กลุ่มงานภาคีเครือข่าย"];
const UNGROUPED = "อื่นๆ (ไม่ระบุกลุ่ม)";
const DEFAULT_SCORE = {on:1, partial:0.5, late:0, none:-1};
const S = {db:null, canEdit:false, staff:[], years:[], fy:null, indicators:[], tasks:[], scoring:{...DEFAULT_SCORE}, customGroups:[],
  tab:"grid", group:"", isAdmin:false, viewAsUser:false, taskFilter:"", assignPop:null, sample:null, sampleCaps:null,
  imp:{files:[], text:"", group:"", items:null, status:"", err:false, busy:false, src:{}, attach:true}, assets:null, sort:{k:"order",dir:1}, q:"", posFilter:"", panel:null, armed:null, pop:null, addingGroup:false,
  loaded:{staff:false,tasks:false}};
let unsubFy = [];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*100)/100).toLocaleString("th-TH",{maximumFractionDigits:2});
const fmtScore = n => n<0 ? "−"+fmt(-n) : fmt(n);
const thDate = d => { if(!d) return "—"; const x=new Date(d+"T00:00:00"); return isNaN(x)?d:x.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}); };
const currentFY = () => { const d=new Date(); return String((d.getMonth()>=9? d.getFullYear()+1 : d.getFullYear())+543); };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function fail(e){ console.error(e); const c=e&&e.code; toast(c==="quota_exceeded"?"ฐานข้อมูลเต็ม: ลบงานเก่าที่ไม่ใช้ก่อน":c==="invalid_argument"?"บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์แก้ไข":"บันทึกไม่สำเร็จ ลองอีกครั้ง"); }
const staffById = id => S.staff.find(s=>s.id===id);
const activeStaff = () => S.staff.filter(s=>s.active!==false);
const indById = id => S.indicators.find(i=>i.id===id);
const scoreOf = k => (k && S.scoring[k]!=null) ? Number(S.scoring[k]) : null;
const groupOfInd = i => (i && i.group) ? i.group : UNGROUPED;
const allGroups = () => { const g=[...GROUPS_FIXED, ...S.customGroups.filter(x=>!GROUPS_FIXED.includes(x))];
  S.indicators.forEach(i=>{ if(i.group && !g.includes(i.group)) g.push(i.group); }); return g; };
const visInds = () => sortedIndicators().filter(i=> !S.group || groupOfInd(i)===S.group);
const visTasks = () => { const ids=new Set(visInds().map(i=>i.id)); return S.tasks.filter(t=> !S.group ? true : ids.has(t.indicatorId) || (S.group===UNGROUPED && !indById(t.indicatorId))); };
function sortedIndicators(){ return [...S.indicators].sort((a,b)=>(a.code||"").localeCompare(b.code||"","th",{numeric:true}) || (a.created||0)-(b.created||0)); }
const sortTasks = list => [...list].sort((a,b)=>{ const ia=indById(a.indicatorId), ib=indById(b.indicatorId);
  return (ia?.code||"~").localeCompare(ib?.code||"~","th",{numeric:true}) || (a.due||"9").localeCompare(b.due||"9") || (a.created||0)-(b.created||0); });

const shortName = n => String(n||"").replace(/^(นางสาว|นาง|นาย|น\.ส\.)\s*/,"");
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const topicOf = t => String(t.name||"").replace(/^[\s\d.()\-–:]+(?=\S)/,"").replace(/\s+/g," ").trim() || String(t.name||"").trim();
function topicsOf(tasks){ const m=new Map(); sortTasks(tasks).forEach(t=>{ const k=topicOf(t); if(!m.has(k)) m.set(k,[]); m.get(k).push(t); }); return [...m.entries()].map(([name,list])=>({name,list})); }
function popTasks(key){ if(key.startsWith("t:")){ const t=S.tasks.find(x=>x.id===key.slice(2)); return t?[t]:[]; } const name=key.slice(2); return sortTasks(visTasks()).filter(t=>topicOf(t)===name); }
function aggPill(list, sid){
  const mine=list.filter(t=>(t.assignees||[]).includes(sid));
  if(!mine.length) return S.canEdit? '<span class="plus" aria-hidden="true">+</span>' : "";
  if(mine.length===1) return pillFor(mine[0], sid);
  const ks=mine.map(t=>((t.results||{})[sid]||{}).status||null); const sum=ks.reduce((a,k)=>a+(k?scoreOf(k):0),0);
  const cls = ks.includes("none")?"p-none": ks.includes(null)?"p-wait": ks.every(k=>k==="on")?"p-on": ks.includes("partial")?"p-partial":"p-late";
  return `<span class="pill ${cls}">${ks.every(k=>!k)?"รอ":fmtScore(sum)}<small style="font-weight:600;opacity:.75;margin-left:3px">×${mine.length}</small></span>`;
}
function taskProg(t){ const a=t.assignees||[], r=t.results||{}; let sub=0, ev=0;
  a.forEach(id=>{ const k=r[id]&&r[id].status; if(k) ev++; if(k && k!=="none") sub++; });
  const state = !a.length? "unassigned" : sub===a.length? "done" : "incomplete";
  return {n:a.length, sub, ev, state, overdue: !!(t.due && t.due<todayISO() && state==="incomplete")}; }
/* ---------- stats ---------- */
function personStats(tasks){
  const m = {};
  S.staff.forEach(s=> m[s.id] = {s, tasks:0, on:0, partial:0, late:0, none:0, wait:0, score:0, byInd:{}, byGroup:{}, list:[]});
  tasks.forEach(t=>{
    (t.assignees||[]).forEach(id=>{
      const p = m[id]; if(!p) return;
      p.tasks++; p.byInd[t.indicatorId]=(p.byInd[t.indicatorId]||0)+1;
      const g=groupOfInd(indById(t.indicatorId)); const bg=p.byGroup[g]=p.byGroup[g]||{inds:new Set(), tasks:0}; bg.inds.add(t.indicatorId); bg.tasks++;
      const r = (t.results||{})[id]||{};
      if(r.status && DEFAULT_SCORE.hasOwnProperty(r.status)){ p[r.status]++; p.score += scoreOf(r.status); } else p.wait++;
      p.list.push({t, r});
    });
  });
  Object.values(m).forEach(p=>{ p.nInd=Object.keys(p.byInd).length; const ev=p.tasks-p.wait; p.evaluated=ev; p.avg = ev? p.score/ev : null; p.onPct = ev? p.on/ev*100 : null; });
  return m;
}
function loadChip(n, avg){
  if(n===0) return '<span class="chip c-zero">ยังไม่มีงาน</span>';
  if(avg>0 && n>=avg*1.5) return '<span class="chip c-high">งานมาก</span>';
  if(avg>0 && n<=avg*0.5) return '<span class="chip c-low">งานน้อย</span>';
  return "";
}
function pillFor(t, sid){
  const a=(t.assignees||[]).includes(sid); if(!a) return '<span class="plus" aria-hidden="true">+</span>';
  const r=(t.results||{})[sid]; const k=r&&r.status;
  if(!k) return '<span class="pill p-wait">รอ</span>';
  return `<span class="pill p-${k}">${fmtScore(scoreOf(k))}</span>`;
}

/* ---------- hover summary ---------- */
const canHover = matchMedia("(hover: hover)").matches;
function tipHtml(sid, tid){
  const s=staffById(sid); if(!s) return "";
  const vis=personStats(visTasks())[sid], all=personStats(S.tasks)[sid];
  const groups=Object.entries(all.byGroup).sort((a,b)=>b[1].tasks-a[1].tasks);
  let task=""; if(tid){ const t=S.tasks.find(x=>x.id===tid); const r=t&&(t.results||{})[sid]; const k=r&&r.status;
    if(t && (t.assignees||[]).includes(sid)) task=`<div class="tl" style="margin-top:6px">งานนี้: ${esc(t.name)} — ${k?STATUS.find(x=>x.k===k).label+" ("+fmtScore(scoreOf(k))+")":"รอประเมิน"}</div>`; }
  return `<b>${esc(s.name)}</b><div>รับผิดชอบ <b>${all.tasks}</b> งาน · <b>${all.nInd}</b> ตัวชี้วัด <span class="tl">(ปีงบ ${esc(S.fy)})</span></div>
    ${S.group?`<div class="tl">เฉพาะ${esc(S.group)}: ${vis.tasks} งาน · ${vis.nInd} ตัวชี้วัด</div>`:""}
    ${groups.length?`<div class="tg">${groups.map(([g,v])=>`<span>${esc(g)}</span><span>${v.inds.size} ตัวชี้วัด · ${v.tasks} งาน</span>`).join("")}</div>`:""}
    <div>คะแนนรวม <b>${fmtScore(all.score)}</b>${all.avg!=null?` · เฉลี่ย ${fmtScore(all.avg)}`:""}</div>
    <div class="tl">ครบตรงเวลา ${all.on} · ไม่ครบ ${all.partial} · ล่าช้า ${all.late} · ไม่ส่ง ${all.none} · รอ ${all.wait}</div>${task}`;
}
function showTip(el, e){ const tip=$("#tip"); const [sid,tid]=el.dataset.tip.split("|"); const h=tipHtml(sid,tid); if(!h) return;
  tip.innerHTML=h; tip.hidden=false; moveTip(e); }
function moveTip(e){ const tip=$("#tip"); if(tip.hidden) return; const w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+14, y=e.clientY+16; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-12;
  tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px"; }
const hideTip=()=>{ const t=$("#tip"); if(t) t.hidden=true; };
if(canHover){
  document.addEventListener("mouseover", e=>{ const el=e.target.closest?.("[data-tip]"); if(el) showTip(el,e); else hideTip(); });
  document.addEventListener("mousemove", e=>{ if(e.target.closest?.("[data-tip]")) moveTip(e); });
  document.addEventListener("mousedown", hideTip, true);
}

/* ---------- render (deferred while someone is typing) ---------- */
let renderDeferred=false;
function isTyping(){ const a=document.activeElement; return !!(a && a.matches && a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select')); }
function softRender(){ if(isTyping()){ renderDeferred=true; return; } render(); }
document.addEventListener("focusout", ()=>setTimeout(()=>{ if(renderDeferred && !isTyping()){ renderDeferred=false; render(); } },200));
/* ---------- render ---------- */
function render(){
  S.canEdit = S.isAdmin && !S.viewAsUser;
  if(!S.canEdit && ADMIN_TABS.includes(S.tab)) S.tab="grid";
  document.getElementById("app").classList.toggle("ro", !S.canEdit);
  renderTabs(); renderRole(); renderFySelect(); renderGroups();
  const v = $("#view");
  const mx = v.querySelector(".mx"); const keep = mx? [mx.scrollLeft, mx.scrollTop] : null;
  if(!NFE.configured){ v.innerHTML = '<div class="notice">ยังไม่ได้เชื่อมฐานข้อมูล: ใส่ URL ของ Google Apps Script ในไฟล์ <b>config.js</b> (ดูวิธีใน README)</div>'; return; }
  if(NFE.store.error && NFE.store.error.code==="view" && !NFE.store.loaded){ v.innerHTML = `<form class="card" id="viewForm" style="max-width:420px"><h3>ใส่รหัสเข้าดู</h3><p class="mini">ระบบนี้ตั้งรหัสสำหรับเปิดดูไว้ ขอรหัสได้จากผู้ดูแลระบบ</p><div class="form"><input type="password" id="viewPass" placeholder="รหัสเข้าดู" required><button class="btn pri" type="submit">เข้าดู</button></div></form>`; return; }
  if(NFE.store.error && !NFE.store.loaded){ v.innerHTML = '<div class="notice">เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบ URL ใน config.js และการตั้งค่าเว็บแอป (ผู้มีสิทธิ์เข้าถึง: ทุกคน) แล้วโหลดหน้าใหม่</div>'; return; }
  if(!S.db || !NFE.store.loaded){ v.innerHTML = '<div class="notice">กำลังโหลดข้อมูล…</div>'; return; }
  if(S.tab==="grid") v.innerHTML = viewGrid();
  else if(S.tab==="report") v.innerHTML = viewReport();
  else if(S.tab==="manage") v.innerHTML = viewTasks();
  else if(S.tab==="import") v.innerHTML = viewImport();
  else v.innerHTML = viewStaff();
  const mx2 = v.querySelector(".mx"); if(mx2 && keep){ mx2.scrollLeft=keep[0]; mx2.scrollTop=keep[1]; }
  const q=$("#q"); if(q && document.activeElement?.id!=="q") q.value=S.q;
  if(S.panel && S.panel.type==="task") captureTask();
  renderPanel(); renderPop(); renderAssign();
}
const ADMIN_TABS=["import","settings"];
function renderTabs(){
  const tabs=[["grid","ตารางคะแนน"],["manage","งานและผู้รับผิดชอบ"],["report","รายงานประจำปี"]];
  const adm=[["import","นำเข้าจากไฟล์"],["settings","ตั้งค่า"]];
  const b=([k,l],a)=>`<button class="tab${a?" adm":""}" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`;
  const html = tabs.map(t=>b(t)).join("") + (S.canEdit? '<span class="tabsep" aria-hidden="true"></span>'+adm.map(t=>b(t,1)).join("") : "");
  const el=$("#tabs"); if(el.innerHTML!==html) el.innerHTML=html;
}
function renderRole(){
  const el=$("#role"); if(!S.db){ el.innerHTML=""; return; }
  el.innerHTML = S.isAdmin
    ? (S.viewAsUser? `<span class="badge">มุมมองผู้ใช้ทั่วไป</span><button type="button" id="roleToggle">กลับเป็นผู้ดูแล</button>`
                   : `<span class="badge admin">ผู้ดูแลระบบ</span><button type="button" id="roleToggle">ดูแบบผู้ใช้ทั่วไป</button><button type="button" id="logout">ออกจากระบบ</button>`)
    : `<span class="badge">ผู้ใช้ทั่วไป · ดูอย่างเดียว</span><button type="button" id="loginBtn">เข้าสู่ระบบผู้ดูแล</button>`;
}
function renderFySelect(){
  const sel=$("#fy"); const ys = new Set(S.years.map(y=>y.id)); ys.add(S.fy);
  const list=[...ys].filter(Boolean).sort((a,b)=>b.localeCompare(a));
  const html = list.map(y=>`<option value="${esc(y)}" ${y===S.fy?"selected":""}>${esc(y)}</option>`).join("");
  if(sel.innerHTML!==html) sel.innerHTML=html;
}
function renderGroups(){
  const el=$("#groups"); if(document.activeElement?.id==="newGroup") return;
  const cnt = g => { const ids=new Set(S.indicators.filter(i=>groupOfInd(i)===g).map(i=>i.id)); return S.tasks.filter(t=>ids.has(t.indicatorId)).length; };
  const gs = allGroups();
  const hasUngrouped = S.indicators.some(i=>!i.group) || S.tasks.some(t=>!indById(t.indicatorId));
  const chip = (g,label,n) => `<button type="button" class="gchip" data-group="${esc(g)}" aria-pressed="${S.group===g}">${esc(label)}<span class="n">${n}</span></button>`;
  el.innerHTML = chip("","ทุกกลุ่มงาน",S.tasks.length) + gs.map(g=>chip(g,g,cnt(g))).join("") +
    (hasUngrouped? chip(UNGROUPED,UNGROUPED,S.tasks.filter(t=>{const i=indById(t.indicatorId); return !i||!i.group;}).length):"") +
    (S.canEdit? (S.addingGroup? `<form class="gadd" id="groupForm"><input type="text" id="newGroup" placeholder="ชื่อกลุ่มงานอื่นๆ" required><button class="btn sm pri" type="submit">เพิ่ม</button><button class="btn sm" type="button" id="cancelGroup">ยกเลิก</button></form>`

function staffRowsFor(tasks){
  const assigned=new Set(tasks.flatMap(t=>t.assignees||[]));
  return [...S.staff].sort((a,b)=>(a.order||0)-(b.order||0))
    .filter(s=> s.active!==false || assigned.has(s.id))
    .filter(s=> !S.posFilter || (s.position||"ไม่ระบุตำแหน่ง")===S.posFilter)
    .filter(s=> !S.q || (s.name||"").includes(S.q));
}
function filterBar(extra=""){

  return `<input type="search" id="q" placeholder="ค้นหาชื่อ" aria-label="ค้นหาชื่อ">

    <div class="ptitle">${esc(title)}</div>
    ${!mine.length && !ro && list.length===1? `<p class="mini" style="margin:4px 0 0">กดมอบหมาย แล้วเลือกคะแนนได้ทันที</p>`:""}
    <div class="plist">${mine.map(row).join("")}${others.length&&!ro? (mine.length?`<div class="mini" style="margin:10px 0 4px">รายการอื่นในหัวข้อนี้ที่ยังไม่ได้รับ</div>`:"")+others.map(row).join(""):""}</div>

  </div>`;

  if(!cell && innerWidth>600){ pop.style.left=Math.max(12,(innerWidth-pop.offsetWidth)/2)+"px"; pop.style.top="90px"; }
  if(cell && innerWidth>600){ const rc=cell.getBoundingClientRect(); const w=pop.offsetWidth, h=pop.offsetHeight;
    let x=rc.right+8, y=rc.top-10; if(x+w>innerWidth-12) x=rc.left-w-8; if(x<12) x=Math.max(12,Math.min(innerWidth-w-12,rc.left));
    if(y+h>innerHeight-12) y=Math.max(12,innerHeight-h-12); pop.style.left=x+"px"; pop.style.top=y+"px"; }
}
async function writeCell(tid,sid,patch,opts={}){
  const t=S.tasks.find(x=>x.id===tid); if(!t) return;
  let assignees=[...(t.assignees||[])];
  const body={updated:Date.now()};
  if(opts.unassign){ assignees=assignees.filter(x=>x!==sid); body.assignees=assignees; body.results={[sid]:null}; }
  else { if(!assignees.includes(sid)){ assignees.push(sid); body.assignees=assignees; }
    if(patch) body.results={[sid]:{status:null,date:"",note:"",...((t.results||{})[sid]||{}),...patch}}; }
  const p=S.db.doc("tasks/"+tid).update(body);
  const loc=S.tasks.find(x=>x.id===tid); if(loc){ if(body.assignees) loc.assignees=body.assignees; if(body.results){ loc.results={...(loc.results||{})}; for(const k in body.results) loc.results[k]=body.results[k]; } }
  try{ await p; }catch(err){ fail(err); }
}

  if(!inds.length) return addForm + head + `<div class="notice">${S.group?"กลุ่มงาน “"+esc(S.group)+"” ":""}ปีงบประมาณ ${esc(S.fy)} ยังไม่มีตัวชี้วัดย่อย${S.canEdit?" เริ่มจากเพิ่มตัวชี้วัด หรือนำเข้าจากไฟล์ แล้วกด “+ เพิ่มงาน” และเลือกผู้รับผิดชอบของแต่ละงาน":""}</div>`;
  const pass = t => !S.taskFilter || taskProg(t).state===S.taskFilter;
  const tasksOf = id => S.tasks.filter(t=>t.indicatorId===id && pass(t)).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9") || (a.created||0)-(b.created||0));
  const taskRow = t => { const p=taskProg(t); const a=t.assignees||[]; const r=t.results||{};
    const badge = p.state==="unassigned"? '<span class="chip c-zero">ยังไม่ระบุผู้รับผิดชอบ</span>' : p.state==="done"? '<span class="chip c-ok">ส่งครบแล้ว</span>'
      : `<span class="chip ${p.overdue?"c-zero":"c-high"}">${p.overdue?"เลยกำหนด · ":""}ยังไม่ส่ง ${p.n-p.sub} คน</span>`;
    const people = a.map(id=>{ const s=staffById(id); const k=r[id]&&r[id].status;
      return `<button type="button" class="pchip ${k?"k-"+k:"k-wait"}" data-cell="${esc("t:"+t.id+"|"+id)}" data-tip="${esc(id+"|"+t.id)}">${esc(shortName(s?.name||"(ไม่พบรายชื่อ)"))}<b>${k?fmtScore(scoreOf(k)):"รอ"}</b></button>`; }).join("");
    return `<div class="task2"><div class="t-top"><div class="t-main" data-task="${esc(t.id)}" tabindex="0"><div class="tn">${esc(t.name)}</div>
        <div class="tm">กำหนดส่ง ${thDate(t.due)}${p.n?` · ผู้รับผิดชอบ ${p.n} คน · ส่งแล้ว ${p.sub}/${p.n}`:""}</div></div>${badge}</div>
      ${p.n?`<div class="prog" aria-hidden="true"><span style="width:${p.sub/p.n*100}%"></span></div>`:""}
      <div class="people">${people}${S.canEdit?`<button type="button" class="btn sm ${p.n?"ghost":"pri"}" data-assign="${esc(t.id)}">${p.n?"+ เพิ่ม/แก้ไขผู้รับผิดชอบ":"+ เลือกผู้รับผิดชอบ"}</button>`:""}</div></div>`; };
  const block = (ind, list) => `<section class="ind">
    <div class="ind-h">${ind?`<span class="code">${esc(ind.code)}</span>`:""}<h3>${ind?esc(ind.name):"งานที่ไม่ได้อยู่ในตัวชี้วัด"}</h3>
      <span class="meta">${list.length} งาน</span>
      ${ind?`<button class="btn sm" data-docs="${esc(ind.id)}" type="button">เอกสาร/ต้นเรื่อง${(ind.docs||[]).length?` (${ind.docs.length})`:""}</button>
      <button class="btn sm pri edit-only" data-newtask="${esc(ind.id)}" type="button">+ เพิ่มงาน</button>
      <button class="btn sm ghost edit-only" data-editind="${esc(ind.id)}" type="button">แก้ไข</button>`:""}</div>
    ${ind&&(ind.docs||[]).length? `<div class="origin">ต้นเรื่อง: ${originLine(ind.docs[ind.docs.length-1])}${ind.docs.length>1?` · และอีก ${ind.docs.length-1} ฉบับ`:""}</div>` : ""}

  const groupsShown = S.group? [S.group] : [...allGroups(), UNGROUPED];
  const orphan = S.tasks.filter(t=>!indById(t.indicatorId) && pass(t));
  const body = groupsShown.map(g=>{ const list=inds.filter(i=>groupOfInd(i)===g && (!S.taskFilter || tasksOf(i.id).length)); const extra = g===UNGROUPED && orphan.length;
      if(!list.length && !extra) return "";
      return `<div class="ghead">${esc(g)}</div>` + list.map(i=>block(i, tasksOf(i.id))).join("") + (extra? block(null, orphan):""); }).join("");
  return quickForm() + addForm + head + (body || '<div class="notice">ไม่มีงานตามตัวกรองนี้</div>') +
    `<div class="legend"><span class="pchip k-on">ชื่อ<b>${fmtScore(S.scoring.on)}</b></span> ครบตรงเวลา <span class="pchip k-partial">ชื่อ<b>${fmtScore(S.scoring.partial)}</b></span> ไม่ครบ/ไม่ตามกำหนด <span class="pchip k-late">ชื่อ<b>${fmtScore(S.scoring.late)}</b></span> ล่าช้า <span class="pchip k-none">ชื่อ<b>${fmtScore(S.scoring.none)}</b></span> ไม่ส่ง <span class="pchip k-wait">ชื่อ<b>รอ</b></span> รอประเมิน · ${S.canEdit?"คลิกชื่อเพื่อให้คะแนน":"คลิกชื่อเพื่อดูรายละเอียด"}</div>`;
}

const SOURCES=["สกร.จังหวัดหนองบัวลำภู","กรมส่งเสริมการเรียนรู้ (สกร.)","กระทรวงศึกษาธิการ","อำเภอ / ส่วนราชการในพื้นที่","องค์กรปกครองส่วนท้องถิ่น","ภาคีเครือข่าย","ภายในหน่วยงาน (คำสั่ง/มติที่ประชุม)","อื่นๆ"];
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function originLine(d){ return [d.source?`<b>${esc(d.source)}</b>`:"", d.refNo?"ที่ "+esc(d.refNo):"", d.date?"ลว. "+thDate(d.date):"", d.subject?"เรื่อง "+esc(d.subject):""].filter(Boolean).join(" · ") || "ไม่ได้ระบุ"; }
const UPLOAD_TYPES={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",txt:"text/plain",csv:"text/csv",md:"text/markdown",json:"application/json",mp4:"video/mp4"};
const uploadType = f => UPLOAD_TYPES[(f.name.split(".").pop()||"").toLowerCase()] || (/^(image|video)\//.test(f.type)? f.type : null);
async function uploadFiles(files){
  const out=[], skipped=[];
  if(!files.length) return {out, skipped};
  if(!S.assets){ return {out, skipped: files.map(f=>f.name)}; }
  for(const f of files){
    try{ const r=await S.assets.upload(f); out.push({assetId:r.id, url:r.url, name:f.name, type:r.contentType, size:r.sizeBytes}); }
    catch(err){ console.error(err); skipped.push(f.name); } }
  return {out, skipped};
}

  <div class="grid2" style="gap:12px"><label class="field"><span>เลขที่หนังสือ</span><input type="text" id="${pre}refNo" value="${esc(d.refNo||"")}" placeholder="เช่น ศธ 0210.xx/1234"></label>

document.addEventListener("click", async e=>{

document.addEventListener("submit", async e=>{
  if(e.target.id!=="docForm") return; e.preventDefault(); e.stopImmediatePropagation();

    .forEach(s=>{ const g=s.position||"ไม่ระบุตำแหน่ง"; (groups[g]=groups[g]||[]).push(s); });
  const html = Object.entries(groups).map(([g,list])=>{ const shown=list.filter(s=>!f||s.name.includes(f)); if(!shown.length) return "";

function loadScript(src){ return new Promise((ok,no)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const el=document.createElement("script"); el.src=src; el.onload=ok; el.onerror=()=>no(new Error("load")); document.head.appendChild(el); }); }
async function docxText(f){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); return r.value||""; }
async function pdfDoc(f){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise; }
async function pdfText(doc){ let out=""; for(let i=1;i<=Math.min(doc.numPages,40);i++){ const pg=await doc.getPage(i); const c=await pg.getTextContent(); out+=c.items.map(x=>x.str).join(" ")+"\n"; } return out; }
async function pdfImages(doc,max){ const out=[]; for(let i=1;i<=Math.min(doc.numPages,max);i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:1.6}); const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; out.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85))); } return out; }
async function gatherSources(){
  const I=S.imp; let text=I.text.trim()? "ข้อความที่พิมพ์:\n"+I.text.trim()+"\n\n" : ""; const images=[]; const maxImg=S.sampleCaps?.images?.maxCount||0;
  for(const f of I.files){
    const n=f.name.toLowerCase();
    if(/^image\//.test(f.type)){ if(!maxImg) throw {code:"local", message:"มุมมองนี้ส่งรูปภาพให้อ่านไม่ได้ ลองใช้ไฟล์ Word/PDF หรือพิมพ์ข้อความแทน"}; images.push(f); }
    else if(n.endsWith(".docx")){ text+=`ไฟล์ ${f.name}:\n`+await docxText(f)+"\n\n"; }
    else if(n.endsWith(".pdf")){ let doc; try{ doc=await pdfDoc(f); }catch(_){ throw {code:"local", message:"เปิด PDF ไม่ได้ ลองถ่ายภาพหน้าเอกสารแล้วอัปโหลดเป็นรูปแทน"}; }
      const t=await pdfText(doc); if(t.replace(/\s/g,"").length>80) text+=`ไฟล์ ${f.name}:\n`+t+"\n\n";
      else if(maxImg) images.push(...await pdfImages(doc, Math.max(1,maxImg-images.length)));
      else throw {code:"local", message:`${f.name} เป็นภาพสแกน อ่านข้อความไม่ได้ในมุมมองนี้`}; }
    else if(/\.(txt|csv)$/.test(n) || /^text\//.test(f.type)){ text+=`ไฟล์ ${f.name}:\n`+await f.text()+"\n\n"; }
    else throw {code:"local", message:`ยังไม่รองรับไฟล์ ${f.name} (ใช้รูปภาพ, .docx, .pdf หรือ .txt)`};
  }
  if(images.length>maxImg && maxImg) images.length=maxImg;
  if(text.length>120000) text=text.slice(0,120000);
  return {text, images};
}
function normDue(v){ v=String(v||"").trim(); let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m){ let y=+m[1]; if(y>2400) y-=543; return `${y}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; }
  m=v.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if(m){ let y=+m[3]; if(y<100) y+=2500; if(y>2400) y-=543; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; } return ""; }
function cleanItems(raw, defGroup){
  const arr = Array.isArray(raw)? raw : Array.isArray(raw?.indicators)? raw.indicators : [];
  return arr.slice(0,200).map((x,i)=>({include:true, group:String(x?.group||defGroup||GROUPS_FIXED[0]).trim().slice(0,80), code:String(x?.code||String(i+1)).trim().slice(0,20),
    name:String(x?.name||"").trim().slice(0,300), tasks:(Array.isArray(x?.tasks)?x.tasks:[]).slice(0,100).map(t=>({name:String(typeof t==="string"?t:t?.name||"").trim().slice(0,300), due:normDue(t?.due)})).filter(t=>t.name)}))
    .filter(x=>x.name||x.tasks.length);

function parseLocal(text, defGroup){
  const items=[]; let group=defGroup||GROUPS_FIXED[0]; let cur=null; const gs=allGroups();
  text.split(/\n/).forEach(raw=>{ const l=raw.trim(); if(!l) return;
    const g=gs.find(g=>l.replace(/^กลุ่มงาน\s*/,"").replace(/[:：]$/,"")===g.replace(/^กลุ่มงาน/,"") || l.replace(/[:：]$/,"")===g); if(g){ group=g; cur=null; return; }
    let m=l.match(/^(?:ตัวชี้วัด(?:ย่อย)?(?:ที่)?\s*)?(\d+(?:\.\d+)+)\s*[:.)\-]?\s*(.+)$/);
    if(m){ cur={include:true, group, code:m[1], name:m[2].trim(), tasks:[]}; items.push(cur); return; }
    m=l.match(/^(?:[-•*–·]|\(?\d+\))\s*(.+)$/); const name=(m?m[1]:l).trim();
    if(!cur){ cur={include:true, group, code:String(items.length+1), name: m? "(ตั้งชื่อตัวชี้วัด)" : name, tasks:[]}; items.push(cur); if(!m) return; }
    const due=normDue(name); cur.tasks.push({name:name.replace(/\s*(ส่ง|กำหนดส่ง|ภายใน(วันที่)?)\s*\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\s*$/,"").trim(), due});
  });
  items.forEach(x=>{ if(!x.tasks.length) x.tasks.push({name:x.name, due:""}); });
  return items;
}
async function doImport(){
  const items=S.imp.items.filter(x=>x.include && x.name.trim()); if(!items.length) return;

  try{
    const newGroups=[...new Set(items.map(x=>x.group.trim()).filter(g=>g && !allGroups().includes(g)))];
    if(newGroups.length) await S.db.doc("settings/groups").set({custom:[...S.customGroups,...newGroups]});
    let nT=0, nUn=0, base=Date.now(); let skippedFiles=[];
    const sd=S.imp.src||{}; let docEntry=null;
    const anySrc = sd.source||sd.refNo||sd.date||sd.subject;
    if(anySrc || (S.imp.attach && S.imp.files.length)){
      let filesRec=[]; if(S.imp.attach && S.imp.files.length){ setImp({status:"กำลังแนบไฟล์ต้นฉบับ…"}); const u=await uploadFiles(S.imp.files); filesRec=u.out; skippedFiles=u.skipped; setImp({status:"กำลังนำเข้า…"}); }

      for(const t of it.tasks.filter(t=>t.name.trim())){ const as=(t.assignees||[]).filter(x=>staffById(x)); if(!as.length) nUn++;

  }catch(err){ fail(err); setImp({busy:false, err:true, status:"นำเข้าไม่ครบ ตรวจสอบรายการในแท็บจัดการงาน แล้วลองอีกครั้ง"}); }
}

   <div class="tile"><div class="k">คะแนนรวม</div><div class="v ${st.score<0?"neg":""}">${fmtScore(st.score)}</div></div>
   <div class="tile"><div class="k">เฉลี่ย/งาน</div><div class="v">${st.avg==null?"—":fmtScore(st.avg)}</div></div></div>
   <h3 style="margin-bottom:8px">แยกตามกลุ่มงาน</h3>
   <div class="tablebox" style="margin-bottom:20px"><table class="std"><thead><tr><th>กลุ่มงาน</th><th class="num">ตัวชี้วัด</th><th class="num">งาน</th></tr></thead><tbody>${Object.entries(st.byGroup).map(([g,v])=>`<tr><td>${esc(g)}</td><td class="num score">${v.inds.size}</td><td class="num">${v.tasks}</td></tr>`).join("")||'<tr><td class="empty" colspan="3">—</td></tr>'}</tbody></table></div>
   <h3 style="margin-bottom:8px">แยกตามตัวชี้วัดย่อย</h3>
   <div class="tablebox" style="margin-bottom:20px"><table class="std"><tbody>${byInd||'<tr><td class="empty">ยังไม่ได้รับมอบหมายงาน</td></tr>'}</tbody></table></div>
   <h3 style="margin-bottom:8px">รายการงานที่รับผิดชอบ</h3>

}

document.addEventListener("click", async e=>{
  const t=e.target;
  const tab=t.closest("[data-tab]"); if(tab){ S.tab=tab.dataset.tab; S.pop=null; S.assignPop=null; render(); scrollTo({top:0}); return; }
  if(t.id==="roleToggle"){ S.viewAsUser=!S.viewAsUser; S.pop=null; closePanel(); render(); return; }
  if(t.id==="loginBtn"){ openPanel({type:"login"}); return; }
  if(t.id==="logout"){ NFE.logout(); S.isAdmin=false; S.assets=null; S.viewAsUser=false; render(); toast("ออกจากระบบแล้ว"); return; }
  const tf=t.closest("[data-tfilter]"); if(tf){ S.taskFilter=tf.dataset.tfilter; render(); return; }
  const gc=t.closest("[data-group]"); if(gc){ S.group=gc.dataset.group; S.pop=null; render(); return; }
  if(t.id==="addGroup"){ S.addingGroup=true; renderGroups(); return; }
  if(t.id==="cancelGroup"){ S.addingGroup=false; renderGroups(); return; }
  const dg=t.closest("[data-delgroup]"); if(dg){ const g=dg.dataset.delgroup; if(S.armed!=="g:"+g){ S.armed="g:"+g; render(); return; }
    try{ await S.db.doc("settings/groups").set({custom:S.customGroups.filter(x=>x!==g)}); S.armed=null; toast("ลบกลุ่มงานแล้ว (ตัวชี้วัดเดิมยังอยู่)"); }catch(err){fail(err)} return; }
  if(t.closest("[data-closebtn]") || t.matches(".ov")){ closePanel(); return; }
  // popover
  if(S.pop && t.closest(".pop")){
    const ps=t.closest("[data-pick-st]");
    if(ps){ const k=ps.dataset.pickSt, tid=ps.dataset.ptid; const tk=S.tasks.find(x=>x.id===tid); const cur=((tk.results||{})[S.pop.sid]||{});
      const patch={status: cur.status===k ? null : k}; if(patch.status && !cur.date) patch.date=todayISO();
      await writeCell(tid,S.pop.sid,patch); renderPop(); return; }
    const pa=t.closest("[data-pact]");
    if(pa){ const tid=pa.dataset.ptid, act=pa.dataset.pact;
      if(act==="assign") await writeCell(tid,S.pop.sid,null);
      if(act==="clear") await writeCell(tid,S.pop.sid,{status:null,date:"",note:""});
      if(act==="unassign") await writeCell(tid,S.pop.sid,null,{unassign:true});
      render(); return; }
    if(t.id==="popClose"){ S.pop=null; render(); return; }
  }
  const cell=t.closest("[data-cell]"); if(cell){ S.assignPop=null; renderAssign(); const v=cell.dataset.cell; const cut=v.lastIndexOf("|"); const key=v.slice(0,cut), sid=v.slice(cut+1);
    S.pop = (S.pop&&S.pop.key===key&&S.pop.sid===sid)? null : {key,sid};
    document.querySelectorAll(".mx td.cell.sel").forEach(c=>c.classList.remove("sel")); if(S.pop) cell.classList.add("sel"); renderPop(); return; }
  if(S.pop && !t.closest(".pop")){ S.pop=null; document.querySelectorAll(".mx td.cell.sel").forEach(c=>c.classList.remove("sel")); renderPop(); }
  const so=t.closest("[data-sort]"); if(so){ const k=so.dataset.sort; S.sort = S.sort.k===k? {k,dir:-S.sort.dir} : {k,dir:(k==="name"||k==="order")?1:-1}; render(); return; }
  const pr=t.closest("[data-person]"); if(pr){ openPanel({type:"person", id:pr.dataset.person}); return; }
  const tk=t.closest("[data-task]"); if(tk){ const task=S.tasks.find(x=>x.id===tk.dataset.task); if(task) openPanel({type:"task", id:task.id, draft:JSON.parse(JSON.stringify({results:{},assignees:[],...task}))}); return; }
  const nt=t.closest("[data-newtask]"); if(nt){ openPanel({type:"task", isNew:true, draft:{name:"",indicatorId:nt.dataset.newtask,due:"",note:"",assignees:[],results:{}}}); return; }
  const ei=t.closest("[data-editind]"); if(ei){ const i=indById(ei.dataset.editind); openPanel({type:"ind", draft:{...i}}); return; }
  const es=t.closest("[data-editstaff]"); if(es){ const s=staffById(es.dataset.editstaff); openPanel({type:"staff", draft:{...s}}); return; }
  if(t.id==="newStaff"){ const mx=Math.max(0,...S.staff.map(s=>s.order||0)); openPanel({type:"staff", isNew:true, draft:{name:"",position:"",order:mx+1,active:true}}); return; }
  if(t.id==="addFy"){ const next=String(Math.max(Number(currentFY()),...S.years.map(y=>Number(y.id)))+1); const ex=S.years.some(y=>y.id===S.fy);
    try{ if(!ex) await S.db.doc("years/"+S.fy).set({label:S.fy}); await S.db.doc("years/"+next).set({label:next}); setFy(next); toast("เพิ่มปีงบประมาณ "+next+" แล้ว"); }catch(err){fail(err)} return; }
  if(t.id==="copyInd"){ const prev=String(Number(S.fy)-1); try{ const snap=await S.db.collection("indicators").where("fy","==",prev).get();
      if(snap.empty){ toast("ปีงบประมาณ "+prev+" ไม่มีตัวชี้วัด"); return; }
      for(const d of snap.docs){ const x=d.data(); await S.db.collection("indicators").add({fy:S.fy, group:x.group||"", code:x.code, name:x.name, created:Date.now()}); }
      toast("คัดลอก "+snap.size+" ตัวชี้วัดแล้ว"); }catch(err){fail(err)} return; }
  if(t.id==="csv"){ exportCsv(); return; }
  const p=S.panel; if(!p) return;
  if(p.type==="task"){
    const g=t.closest("[data-grp]"); if(g){ captureTask(); const grp=g.dataset.grp; const ids=S.staff.filter(s=>(s.position||"ไม่ระบุตำแหน่ง")===grp && (s.active!==false) && (!p.filter||s.name.includes(p.filter))).map(s=>s.id);
      const set=new Set(p.draft.assignees); ids.forEach(id=> g.dataset.all==="1"? set.add(id) : set.delete(id)); p.draft.assignees=[...set]; renderPanel(); return; }
    const rb=t.closest("[data-res]"); if(rb){ captureTask(); const id=rb.dataset.res, st=rb.dataset.st; const r=p.draft.results[id]=p.draft.results[id]||{};
      r.status = r.status===st? null : st; renderPanel(); return; }
    if(t.id==="allOn"){ captureTask(); p.draft.assignees.forEach(id=>{ const r=p.draft.results[id]=p.draft.results[id]||{}; r.status="on"; if(!r.date && p.draft.due) r.date=p.draft.due; }); renderPanel(); return; }
    if(t.id==="delTask"){ if(S.armed!=="task"){ captureTask(); S.armed="task"; renderPanel(); return; }
      try{ await S.db.doc("tasks/"+p.id).delete(); closePanel(); toast("ลบงานแล้ว"); }catch(err){fail(err)} return; }
  }
  if(p.type==="staff" && t.id==="delStaff"){ if(S.armed!=="staff"){ S.armed="staff"; renderPanel(); return; }
    try{ await S.db.doc("staff/"+p.draft.id).delete(); closePanel(); toast("ลบรายชื่อแล้ว"); }catch(err){fail(err)} return; }
  if(p.type==="ind" && t.id==="delInd"){ if(S.armed!=="ind"){ S.armed="ind"; renderPanel(); return; }
    try{ await S.db.doc("indicators/"+p.draft.id).delete(); closePanel(); toast("ลบตัวชี้วัดแล้ว"); }catch(err){fail(err)} return; }
});

  document.querySelectorAll("[data-rnote]").forEach(el=>{ const r=d.results[el.dataset.rnote]=d.results[el.dataset.rnote]||{}; r.note=el.value; });
}

  const g=$("#"+otherId).value.trim(); if(!g) return null;
  if(!allGroups().includes(g)) await S.db.doc("settings/groups").set({custom:[...S.customGroups, g]});
  return g;
}

      const body={fy:d.fy||S.fy, indicatorId:d.indicatorId, name:d.name.trim(), due:d.due||"", note:d.note||"", assignees:d.assignees, results, updated:Date.now(), created:d.created||Date.now()};

      if(!body.name) return; if(p.isNew) await S.db.collection("staff").add(body); else await S.db.doc("staff/"+p.draft.id).set(body); closePanel(); toast("บันทึกแล้ว"); }
    else if(f.id==="scoreForm"){ const sc={}; STATUS.forEach(x=>{ const n=parseFloat($("#sc-"+x.k).value); sc[x.k]=isNaN(n)?DEFAULT_SCORE[x.k]:n; }); await S.db.doc("settings/scoring").set(sc); toast("บันทึกเกณฑ์คะแนนแล้ว"); }
    else if(f.id==="bulkForm"){ const lines=$("#bulk").value.split(/\n/).map(l=>l.trim()).filter(Boolean); let o=Math.max(0,...S.staff.map(s=>s.order||0));
      for(const l of lines){ const [name,...rest]=l.split(/[,\t]/); if(!name.trim()) continue; await S.db.collection("staff").add({name:name.trim(), position:rest.join(",").trim(), order:++o, active:true}); }
      $("#bulk").value=""; toast("เพิ่ม "+lines.length+" รายชื่อแล้ว"); }
  }catch(err){ fail(err); }

async function exportCsv(){
  const tasks=visTasks(); const st=personStats(tasks); const inds=visInds();
  const head=["ที่","ชื่อ-สกุล","ตำแหน่ง","จำนวนงาน","จำนวนตัวชี้วัด","ครบตรงเวลา","ไม่ครบ/ไม่ตามกำหนด","ล่าช้า","ไม่ส่ง","รอประเมิน","คะแนนรวม","คะแนนเฉลี่ยต่องาน",...inds.map(i=>groupOfInd(i)+" "+i.code)];
  const rows=[...S.staff].sort((a,b)=>(a.order||0)-(b.order||0)).filter(s=>s.active!==false||st[s.id].tasks).map((s,i)=>{ const p=st[s.id];
    return [i+1,s.name,s.position||"",p.tasks,p.nInd,p.on,p.partial,p.late,p.none,p.wait,p.score,p.avg==null?"":Math.round(p.avg*100)/100,...inds.map(ind=>p.byInd[ind.id]||0)]; });
  const csv="﻿"+[head,...rows].map(r=>r.map(c=>{ const s=String(c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`ภาระงานบุคลากร_ปีงบ${S.fy}${S.group?"_"+S.group:""}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

function setFy(fy){
  S.fy=fy; S.loaded.tasks=false; S.indicators=[]; S.tasks=[]; S.pop=null; S.assignPop=null; closePanel();
  try{ localStorage.setItem("fy", fy); }catch(_){}
  unsubFy.forEach(u=>u()); unsubFy=[];
  if(!S.db){ render(); return; }
  let gotI=false, gotT=false;
  unsubFy.push(S.db.collection("indicators").where("fy","==",fy).onSnapshot(s=>{ S.indicators=s.docs.map(d=>({id:d.id,...d.data()})); gotI=true; if(gotT) S.loaded.tasks=true; softRender(); }, fail));
  unsubFy.push(S.db.collection("tasks").where("fy","==",fy).onSnapshot(s=>{ S.tasks=s.docs.map(d=>({id:d.id,...d.data()})); gotT=true; if(gotI) S.loaded.tasks=true;
    const p=S.panel; if(p&&p.type==="task"&&!p.isNew&&!S.tasks.some(t=>t.id===p.id)) S.panel=null; softRender(); }, fail));
  render();
}

  if(f.id==="loginForm"){ e.preventDefault(); e.stopImmediatePropagation(); const p=S.panel; p.busy=true; p.err=""; const pass=$("#adminPass").value; renderPanel();
    let ok=false; try{ ok=await NFE.login(pass); }catch(err){ p.err="เชื่อมต่อไม่ได้ ลองใหม่"; }
    p.busy=false; if(ok){ S.isAdmin=true; S.assets={upload:NFE.upload}; closePanel(); render(); toast("เข้าสู่ระบบผู้ดูแลแล้ว"); NFE.refresh().catch(()=>{}); } else { p.err=p.err||"รหัสไม่ถูกต้อง"; renderPanel(); } }
  if(f.id==="viewForm"){ e.preventDefault(); e.stopImmediatePropagation(); NFE.setViewPass($("#viewPass").value); NFE.store.error=null; render(); NFE.refresh().catch(()=>render()); }
}, true);
async function start(){
  let fy=currentFY(); try{ fy=localStorage.getItem("fy")||fy; }catch(_){}
  S.fy=fy;
  if(!NFE.configured){ render(); return; }
  const db=NFE.db; S.db=db; S.sample=null; S.sampleCaps=null;
  window.onDbWriteError = fail;
  NFE.checkAdmin().then(ok=>{ S.isAdmin=ok; S.assets= ok? {upload:NFE.upload} : null; render(); });
  const _l={fire:()=>softRender()}; NFE.store.listeners.add(_l);
  NFE.start();
  db.collection("staff").onSnapshot(s=>{ S.staff=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.staff=true; softRender(); }, fail);
  db.collection("years").onSnapshot(s=>{ S.years=s.docs.map(d=>({id:d.id,...d.data()})); softRender(); }, fail);
  db.doc("settings/scoring").onSnapshot(s=>{ S.scoring = s.exists? {...DEFAULT_SCORE,...s.data()} : {...DEFAULT_SCORE}; softRender(); }, fail);
  db.doc("settings/groups").onSnapshot(s=>{ S.customGroups = (s.exists && Array.isArray(s.data().custom))? s.data().custom.map(String) : []; softRender(); }, fail);
  setFy(fy);
}
render(); start();
})();
</script>
